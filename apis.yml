name: Medra
description: 'Medra builds an AI-powered robotic platform for autonomous laboratory
  work in the life sciences. Its "Physical AI Scientist" combines robotic hardware,
  computer vision, and scientific reasoning AI to design, execute, and continuously
  optimize experiments — gene editing, RNA/nucleic-acid work, antibody design, and
  cell-based assays — the way a human scientist would. Units are deployed at partner
  sites including Genentech and Addition Therapeutics, with a DARPA collaboration on
  its AI Experimentalist reasoning layer. Founded by Michelle Lee and headquartered
  in San Francisco, Medra raised a $52M Series A (Dec 2025) from investors including
  Lux Capital and Menlo Ventures. As of this enrichment pass Medra publishes no public
  API, SDK, developer portal, or documentation surface.'
